<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3F5FB">
<title>Agenda 2026 · 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F5FB;
    --bg-2:#EAF1FC;
    --card:#FFFFFF;
    --ink:#14171C;
    --ink-soft:#767E8C;
    --border:#E8EAF1;
    --blue:#2E9EFF;
    --blue-dark:#1C86E6;
    --blue-tint:#DFF0FF;
    --yellow:#FFC94D;
    --red:#FF5B52;
    --green:#34C77B;
    --pink-tag-bg:#FFE2E0;
    --pink-tag-text:#D8493D;
    --green-tag-bg:#DCF6E7;
    --green-tag-text:#1E9A58;
    --r-pill:999px;
    --font-display:'Baloo 2', sans-serif;
    --font-body:'Nunito', sans-serif;
    color-scheme: light;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:var(--font-body);}
  #app{
    position:relative; width:100%; height:100vh; height:100dvh; max-width:900px; margin:0 auto;
    background:var(--bg); overflow:hidden; box-shadow:0 0 60px rgba(20,30,50,.15);
  }
  #app:has(#screen-calendario.active) { max-width:1280px; }
  .screen{
    position:absolute; inset:0; display:flex; flex-direction:column;
    opacity:0; pointer-events:none; transform:translateY(14px);
    transition:opacity .32s ease, transform .32s ease;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .screen:not(.active){ visibility:hidden; }
  .screen.active{ opacity:1; pointer-events:auto; transform:translateY(0); }

  /* ---------- shared buttons ---------- */
  .btn-primary{
    font-family:var(--font-body); font-weight:800; font-size:15px; color:#fff;
    background:var(--blue); border:none; border-radius:var(--r-pill);
    padding:16px 22px; cursor:pointer; box-shadow:0 10px 22px rgba(46,158,255,.35);
    transition:transform .15s ease, background .15s ease;
  }
  .btn-primary:active{ transform:scale(.96); background:var(--blue-dark); }
  .btn-secondary{
    font-family:var(--font-body); font-weight:800; font-size:15px; color:var(--ink);
    background:#fff; border:1.5px solid var(--border); border-radius:var(--r-pill);
    padding:16px 22px; cursor:pointer; transition:transform .15s ease, background .15s ease;
  }
  .btn-secondary:active{ transform:scale(.96); background:var(--bg-2); }

  .round-btn{
    min-height:38px; padding:0 12px; border-radius:var(--r-pill); font:800 13px var(--font-body); color:#fff; border:none; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--blue); box-shadow:0 6px 16px rgba(46,158,255,.35);
    transition:transform .15s ease;
  }
  .round-btn:active{ transform:scale(.9); }
  .round-btn.light{ color:var(--ink); background:#fff; border:1.5px solid var(--border); box-shadow:none; }
  .tool-btn{
    min-height:34px; padding:0 9px; border-radius:var(--r-pill); font:800 12px var(--font-body); color:var(--ink); display:flex;align-items:center;justify-content:center;
    border:1.5px solid var(--border); background:#fff; cursor:pointer;
    transition:background .15s ease, transform .15s ease;
  }
  .tool-btn:active{ transform:scale(.92); }
  .tool-btn.on{ color:#fff; background:var(--blue); border-color:var(--blue); }

  /* ---------- PORTADA ---------- */
  #screen-portada{
    background: radial-gradient(120% 70% at 50% -10%, var(--bg-2) 0%, var(--bg) 60%);
    justify-content:center; align-items:center; position:relative;
    padding-top:calc(env(safe-area-inset-top) + 20px);
  }
  .portada-inner{ text-align:center; padding:0 30px; width:100%; position:relative; z-index:2; }
  .portada-eyebrow{
    font-family:var(--font-body); letter-spacing:.28em; text-transform:uppercase;
    font-size:11.5px; color:var(--ink-soft); margin-bottom:10px; font-weight:800;
  }
  .portada-title{
    font-family:var(--font-display); color:var(--ink); font-weight:800;
    font-size:clamp(36px, 10vw, 58px); line-height:1.02; margin:0;
  }
  .portada-title .years{
    display:block; color:var(--blue); font-size:.56em; margin-top:6px; font-weight:700;
  }
  .portada-sub{
    color:var(--ink-soft); font-size:14.5px; font-weight:600; margin-top:16px; margin-bottom:38px;
    font-family:var(--font-body);
  }
  .portada-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; max-width:380px; margin:0 auto; }
  .portada-btn{
    font-family:var(--font-body); font-weight:800; font-size:15px;
    border:none; border-radius:var(--r-pill); padding:20px 10px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    transition: transform .15s ease;
  }
  .portada-btn:active{ transform:scale(.95); }
  .portada-btn.primary{ background:var(--blue); color:#fff; box-shadow:0 10px 24px rgba(46,158,255,.35); }
  .portada-btn.secondary{ background:#fff; color:var(--ink); border:1.5px solid var(--border); }

  /* ---------- CALENDARIO ---------- */
  #screen-calendario{
    background: radial-gradient(120% 70% at 50% -10%, var(--bg-2) 0%, var(--bg) 60%);
    padding: calc(env(safe-area-inset-top) + 18px) 18px 18px;
  }
  .cal-topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .cal-topbar-title{ color:var(--ink); font-family:var(--font-display); font-size:24px; font-weight:800; }
  .cal-card{
    background:var(--card); border-radius:28px; flex:1; min-height:0;
    display:flex; flex-direction:column; padding:18px 16px 14px;
    box-shadow:0 20px 46px rgba(20,30,50,.10); overflow:hidden;
  }
  .cal-controls{ display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .calendar-period-field {
    display:grid; gap:2px; padding:5px 8px; flex:0 1 auto;
    border:1px solid #d4e0f4; border-radius:13px; background:#f3f7ff;
  }
  .calendar-period-field span { padding-inline:4px; color:#485570; font-size:12px; font-weight:800; }
  .calendar-period-field select {
    min-height:32px; max-width:100%; padding:2px 4px; cursor:pointer;
    color:#173c78; background:transparent; border:0; border-radius:6px;
    font:800 clamp(14px, 2.2vw, 19px) var(--font-body);
  }
  .calendar-period-arrow {
    width:36px; height:36px; flex:none; align-self:end; cursor:pointer;
    border:1px solid #d4e0f4; border-radius:12px; background:white;
    color:#174cab; font:800 25px/1 var(--font-body);
  }
  .calendar-period-arrow:hover { background:#edf4ff; }
  .calendar-period-field select:focus-visible, .calendar-period-arrow:focus-visible {
    outline:2px solid var(--blue); outline-offset:2px;
  }
  @media (max-width:520px) {
    .calendar-period-field { padding-inline:3px; }
    .calendar-period-arrow { width:30px; }
  }
  .day-cell.birthday, .day-cell.birthday:hover { background:#ffe5f1; }
  .birthday-crown { font-size:15px; line-height:1; }
  .day-cell.birthday .day-num { width:auto; max-width:100%; gap:2px; flex-wrap:wrap; height:auto; min-height:28px; }
  .day-tag.birthday-event, .day-tag.google-event.birthday-event { background:#ffe5f1; color:#85234e; }

  .weekdays{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:2px; }
  .weekdays span{
    text-align:center; font-size:10.5px; letter-spacing:.06em; color:var(--ink-soft);
    font-weight:800; padding-bottom:8px; text-transform:uppercase;
  }
  .days-grid{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); grid-auto-rows:1fr; flex:1; gap:3px; overflow:auto; }
  .day-cell{
    border-radius:12px; padding:6px 5px; cursor:pointer; position:relative;
    display:flex; flex-direction:column; gap:3px; min-height:56px; background:transparent;
    transition:background .15s ease;
  }
  .day-cell:hover{ background:var(--bg-2); }
  .day-cell.outside .day-num{ color:#D2D6E0; }
  .day-num{
    font-size:18px; font-weight:800; color:var(--ink); width:min(28px, 100%); height:28px;
    display:flex; align-items:center; justify-content:center; border-radius:50%;
  }
  .day-cell.today{
    background:var(--blue-tint);
    box-shadow:inset 0 0 0 2px var(--blue);
  }
  .day-cell.selected:not(.today) .day-num{ background:var(--blue); color:#fff; }
  .day-tag{
    font-size:9px; font-weight:800; border-radius:6px; padding:2px 5px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.4;
  }
  .tag-pink{ background:var(--pink-tag-bg); color:var(--pink-tag-text); }
  .tag-green{ background:var(--green-tag-bg); color:var(--green-tag-text); }

  /* ---------- DAY DETAIL ---------- */
  #screen-day{ background:var(--bg); padding: calc(env(safe-area-inset-top) + 18px) 20px 20px; }
  .day-topbar{ display:flex; align-items:center; gap:14px; margin-bottom:22px; }
  .day-title{ font-family:var(--font-display); font-size:28px; font-weight:800; color:var(--ink); text-transform:capitalize; }
  .day-sub{ font-size:12px; color:var(--ink-soft); letter-spacing:.05em; text-transform:uppercase; font-weight:800; }
  .day-list{ flex:1; overflow:auto; display:flex; flex-direction:column; gap:10px; }
  .day-item{
    background:#fff; border-radius:16px; padding:14px 16px; display:flex; align-items:center; gap:12px;
    box-shadow:0 4px 14px rgba(20,30,50,.05); border-left:4px solid var(--red);
  }
  .day-item.green{ border-left-color:var(--green); }
  .day-item .time{ font-weight:800; font-size:13px; color:var(--ink); min-width:52px; }
  .day-item .label{ font-size:14px; color:var(--ink); flex:1; font-weight:600; }
  .day-item .del{ border:none; background:transparent; color:#C7CDD9; cursor:pointer; font-size:16px; }
  .day-empty{ text-align:center; color:var(--ink-soft); font-size:14px; margin-top:40px; font-weight:600; }
  .add-row{ display:flex; gap:8px; margin-top:14px; }
  .add-row input{
    flex:1; border:1.5px solid var(--border); border-radius:var(--r-pill); padding:12px 18px; font-size:14px;
    font-family:var(--font-body); font-weight:600; background:#fff;
  }
  .add-row select{
    border:1.5px solid var(--border); border-radius:var(--r-pill); padding:0 12px; font-size:13px; background:#fff; font-weight:700;
  }

  /* ---------- NOTAS GALLERY ---------- */
  #screen-notas{ background:var(--bg); padding: calc(env(safe-area-inset-top) + 18px) 20px 20px; }
  .notas-topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .notas-title{ font-family:var(--font-display); font-size:26px; font-weight:800; color:var(--ink); }
  .notas-topbar-right{ display:flex; gap:10px; align-items:center; }
  .new-note-btn{
    background:var(--blue); color:#fff; border:none; border-radius:var(--r-pill); padding:12px 18px;
    font-weight:800; font-size:13.5px; cursor:pointer; box-shadow:0 8px 18px rgba(46,158,255,.32);
  }
  .notas-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; overflow:auto; padding-bottom:10px; flex:1; align-content:start; }
  .note-card{
    border:0; padding:0; font:inherit; text-align:left; border-radius:18px; overflow:hidden; cursor:pointer; box-shadow:0 6px 16px rgba(20,30,50,.07);
    background:#fff; display:flex; flex-direction:column; transition:transform .15s ease;
  }
  .note-card:active{ transform:scale(.97); }
  .note-thumb{ width:100%; height:120px; position:relative; overflow:hidden; }
  .note-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .note-meta{ min-width:0; max-width:100%; padding:10px 12px 12px; }
  .note-meta .t{ font-size:13px; font-weight:800; color:var(--ink); margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .note-meta .d{ font-size:10.5px; color:var(--ink-soft); font-weight:700; }
  .notas-empty{ text-align:center; color:var(--ink-soft); font-size:14px; margin-top:60px; grid-column:1/-1; font-weight:600; }

  /* ---------- NOTE EDITOR ---------- */
  #screen-editor{ background:var(--bg); }
  .editor-topbar{
    display:flex; align-items:center; gap:10px; padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;
    background:rgba(255,255,255,.75); backdrop-filter:blur(10px); border-bottom:1px solid var(--border);
  }
  .editor-title-input{
    flex:1; border:none; background:transparent; font-family:var(--font-display); font-size:19px;
    font-weight:700; color:var(--ink); outline:none;
  }
  .save-btn{
    margin-left:auto; background:var(--blue); color:#fff; border:none; border-radius:var(--r-pill);
    padding:10px 18px; font-weight:800; font-size:13px; cursor:pointer; flex-shrink:0;
  }
  .editor-toolbar{
    display:grid; grid-template-columns:auto 1fr; align-items:center; gap:10px;
    padding:9px 14px; background:rgba(255,255,255,.75);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--border);
  }
  .toolbar-undo{ display:flex; gap:6px; flex-shrink:0; }
  .toolbar-main{ display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:8px; row-gap:8px; }
  .tool-group{ display:flex; flex-direction:column; align-items:center; gap:4px; flex-shrink:0; }
  .tool-dot{
    width:14px; height:14px; border-radius:50%; cursor:pointer;
    border:1.5px solid #fff; box-shadow:0 0 0 1.5px var(--border); flex-shrink:0;
  }
  .type-row{ display:flex; gap:10px; margin-bottom:18px; }
  .type-opt{
    flex:1; border:1.5px solid var(--border); border-radius:14px; padding:12px 6px; text-align:center;
    cursor:pointer; font-weight:800; font-size:12px; color:var(--ink); background:#fff;
  }
  .type-opt.active{ border-color:var(--blue); background:var(--blue-tint); color:var(--blue-dark); }
  .slider-row{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .slider-row input[type=range]{ flex:1; accent-color:var(--blue); height:20px; }
  .slider-preview{ width:26px; height:26px; border-radius:50%; background:var(--ink); flex-shrink:0; }
  .slider-value{ font-size:12px; font-weight:700; color:var(--ink-soft); min-width:36px; text-align:right; }
  .color-chip{
    display:flex; align-items:center; gap:10px; width:100%; border:1.5px solid var(--border);
    border-radius:14px; padding:10px 14px; background:#fff; cursor:pointer;
    font-family:var(--font-body); font-weight:700; font-size:13px; color:var(--ink);
  }
  .color-chip-swatch{ width:22px; height:22px; border-radius:6px; border:1px solid rgba(0,0,0,.08); flex-shrink:0; }
  .cp-square-wrap{ position:relative; margin-bottom:14px; border-radius:12px; overflow:hidden; }
  #cpSquare{ display:block; width:100%; height:150px; cursor:crosshair; }
  .cp-square-thumb{
    position:absolute; width:16px; height:16px; border-radius:50%; border:2.5px solid #fff;
    box-shadow:0 0 0 1.5px rgba(0,0,0,.35), 0 1px 4px rgba(0,0,0,.3); transform:translate(-50%,-50%); pointer-events:none;
  }
  .cp-hue-row{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .cp-eyedrop{
    min-height:34px; padding:0 9px; border-radius:var(--r-pill); font:800 11px var(--font-body); border:1.5px solid var(--border); background:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .cp-hue-slider{
    flex:1; height:14px; border-radius:7px; -webkit-appearance:none; appearance:none;
    background:linear-gradient(to right, red, #ff0, #0f0, #0ff, #00f, #f0f, red);
  }
  .cp-hue-slider::-webkit-slider-thumb{
    -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:#fff;
    border:2.5px solid #fff; box-shadow:0 0 0 1.5px rgba(0,0,0,.35), 0 1px 4px rgba(0,0,0,.3); cursor:pointer;
  }
  .cp-rgb-row{ display:flex; gap:10px; }
  .cp-rgb-field{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .cp-rgb-field input{
    width:100%; text-align:center; border:1.5px solid var(--border); border-radius:10px; padding:8px 4px;
    font-family:var(--font-body); font-weight:700; font-size:14px; color:var(--ink);
  }
  .cp-rgb-field label{ font-size:10.5px; letter-spacing:.06em; color:var(--ink-soft); font-weight:700; }
  .canvas-wrap{ position:relative; flex:1; overflow:hidden; }
  #noteCanvas{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  .sel-overlay{ position:absolute; inset:0; pointer-events:none; }
  .sel-marquee{ position:absolute; border:2px dashed var(--blue); background:rgba(46,158,255,.08); border-radius:8px; }
  .sel-marquee.circle{ border-radius:50%; }
  .stickies-layer{ position:absolute; inset:0; pointer-events:none; }
  .sticky{ position:absolute; touch-action:none; cursor:grab; }
  .sticky:active{ cursor:grabbing; }
  .sticky.selected{ outline:2.5px solid var(--blue); outline-offset:2px; }
  .sticky-tab{ border-radius:5px; opacity:.55; box-shadow:0 3px 8px rgba(0,0,0,.12); pointer-events:auto; }
  .sticky-square{ border-radius:6px; box-shadow:0 6px 16px rgba(0,0,0,.16); padding:10px; pointer-events:auto; transform:rotate(-1.2deg); }
  .sticky-square .sticky-text{ width:100%; height:100%; outline:none; font-family:var(--font-body); font-size:13px; color:rgba(20,23,28,.82); font-weight:600; overflow:hidden; cursor:text; }
  .sticky-del{
    position:absolute; top:-8px; right:-8px; min-height:20px; padding:0 6px; border-radius:var(--r-pill);
    background:#fff; border:1px solid var(--border); font:800 10px var(--font-body); line-height:18px; text-align:center;
    cursor:pointer; display:none; pointer-events:auto; color:var(--ink-soft); z-index:2;
  }
  .sticky-resize{
    position:absolute; right:-7px; bottom:-7px; width:18px; height:18px; border-radius:50%;
    background:#fff; border:1.5px solid var(--border); cursor:nwse-resize; display:none; pointer-events:auto;
    touch-action:none; z-index:2;
  }
  .sticky:hover .sticky-del, .sticky.dragging .sticky-del, .sticky.selected .sticky-del{ display:block; }
  .sticky:hover .sticky-resize, .sticky.dragging .sticky-resize, .sticky.selected .sticky-resize{ display:block; }
  .sel-del-btn{
    position:absolute; min-height:26px; padding:0 6px; border-radius:var(--r-pill); background:#fff; border:1.5px solid var(--blue);
    color:var(--blue); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px; font-weight:800;
    pointer-events:auto; box-shadow:0 3px 8px rgba(20,30,50,.2); transform:translate(-50%,-50%);
  }
  .text-layer{ position:absolute; inset:0; pointer-events:none; }
  .text-box{
    position:absolute; min-width:60px; min-height:24px; outline:none; font-size:16px;
    color:var(--ink); font-family:var(--font-body); font-weight:600; pointer-events:auto; padding:2px 4px; border-radius:4px;
  }
  .text-box:focus{ background:rgba(255,255,255,.5); }

  .panel{
    position:absolute; bottom:0; left:0; right:0; background:#fff; border-radius:24px 24px 0 0;
    box-shadow:0 -8px 30px rgba(20,30,50,.15); padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);
    transform:translateY(100%); transition:transform .28s ease; z-index:30;
  }
  .panel.open{ transform:translateY(0); }
  .panel h4{ margin:0 0 12px; font-size:13px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); font-weight:800; }
  .swatch-row{ display:flex; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .swatch{ width:38px; height:38px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
  .swatch.active{ border-color:var(--blue); }
  .template-row{ display:flex; gap:12px; }
  .template-opt{ width:64px; height:80px; border-radius:14px; border:2px solid var(--border); cursor:pointer; overflow:hidden; position:relative; background:#fff; }
  .template-opt.active{ border-color:var(--blue); }
  .template-opt.lines::before{ content:''; position:absolute; inset:10px 6px; background-image:repeating-linear-gradient(to bottom, transparent, transparent 10px, #d8dbe4 10px, #d8dbe4 11px); }
  .template-opt.grid::before{ content:''; position:absolute; inset:10px 6px; background-image:repeating-linear-gradient(to bottom, transparent, transparent 10px, #d8dbe4 10px, #d8dbe4 11px), repeating-linear-gradient(to right, transparent, transparent 10px, #d8dbe4 10px, #d8dbe4 11px); }
  .template-opt.dots::before{ content:''; position:absolute; inset:10px 6px; background-image:radial-gradient(#d8dbe4 1px, transparent 1.5px); background-size:11px 11px; }
  .panel-close{
    position:absolute; top:-18px; right:18px; width:36px; height:36px; border-radius:50%;
    background:#fff; box-shadow:0 4px 14px rgba(20,30,50,.15); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }


  ::-webkit-scrollbar{ display:none; }
  .add-row input, .editor-title-input, .cp-hue-slider{ min-width:0; }
  .panel-close{ width:auto; padding-inline:9px; font:800 12px var(--font-body); }
  .day-item .del{ color:var(--ink-soft); font:800 12px var(--font-body); }
  @media (max-width:640px){

  #bookMore { margin:0 0 12px; }

  #bookDetails, #bookRemoveConfirm { width:min(400px,calc(100% - 24px)); border:1px solid #bdcde4; border-radius:16px; color:#18283f; padding:18px; }
  #bookDetails::backdrop, #bookRemoveConfirm::backdrop { background:#17243c70; }

  @media (max-width:580px) {

  @media (max-width:430px) {

    #bookBrowse { max-width:76px; }
    #bookSearchSubmit { position:relative; width:44px; padding:0; }

      content:""; position:absolute; pointer-events:none;
    }

      width:10px; height:10px; border:2px solid currentColor; border-radius:50%;
      top:calc(50% - 8px); left:calc(50% - 8px);
    }

  .editor-body{ position:relative; display:flex; flex:1; min-height:0; flex-direction:column; }

  .editor-toolbar[hidden], .toolbar-grip[hidden]{ display:none; }

<body><div id="app">
  <!-- PORTADA -->

    </div>
  </div>

</div>
<style>
    #screen-acceso, #screen-portada {
