<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="theme-color" content="#FFF5F8">
<title>Agenda 2026 · 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF5F8;
    --bg-2:#F9E6EE;
    --card:#FFFFFF;
    --ink:#34222B;
    --ink-soft:#735563;
    --border:#EAD6E0;
    --accent:#A82E61;
    --accent-dark:#84204A;
    --accent-tint:#FCE3ED;
    --yellow:#FFC94D;
    --red:#FF5B52;
    --green:#34C77B;
    --pink-tag-bg:#FCE0EB;
    --pink-tag-text:#8D2852;
    --green-tag-bg:#DCF6E7;
    --green-tag-text:#236644;
    --r-pill:999px;
    --font-display:'Baloo 2', sans-serif;
    --font-body:'Nunito', sans-serif;
    color-scheme: light;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:var(--font-body);}
  #app{
    position:relative; width:100%; height:100vh; height:100dvh; max-width:900px; margin:0 auto;
    background:var(--bg); overflow:hidden; box-shadow:0 0 60px rgba(76,36,57,.15);
  }
  .screen{
    position:absolute; inset:0; display:flex; flex-direction:column;
    opacity:0; pointer-events:none; transform:translateY(14px);
    transition:opacity .32s ease, transform .32s ease;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .screen:not(.active){ visibility:hidden; }
  .screen.active{ opacity:1; pointer-events:auto; transform:translateY(0); }

  /* ---------- shared buttons ---------- */
  .btn-primary{
    font-family:var(--font-body); font-weight:800; font-size:15px; color:#fff;
    background:var(--accent); border:none; border-radius:var(--r-pill);
    padding:16px 22px; cursor:pointer; box-shadow:0 10px 22px rgba(168,46,97,.35);
    transition:transform .15s ease, background .15s ease;
  }
  .btn-primary:active{ transform:scale(.96); background:var(--accent-dark); }
  .btn-secondary{
    font-family:var(--font-body); font-weight:800; font-size:15px; color:var(--ink);
    background:#fff; border:1.5px solid var(--border); border-radius:var(--r-pill);
    padding:16px 22px; cursor:pointer; transition:transform .15s ease, background .15s ease;
  }
  .btn-secondary:active{ transform:scale(.96); background:var(--bg-2); }

  .round-btn{
    min-height:38px; padding:0 12px; border-radius:var(--r-pill); font:800 13px var(--font-body); color:#fff; border:none; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--accent); box-shadow:0 6px 16px rgba(168,46,97,.35);
    transition:transform .15s ease;
  }
  .round-btn:active{ transform:scale(.9); }
  .round-btn.light{ color:var(--ink); background:#fff; border:1.5px solid var(--border); box-shadow:none; }
  .tool-btn{
    min-height:34px; padding:0 9px; border-radius:var(--r-pill); font:800 12px var(--font-body); color:var(--ink); display:flex;align-items:center;justify-content:center;
    border:1.5px solid var(--border); background:#fff; cursor:pointer;
    transition:background .15s ease, transform .15s ease;
  }
  .icon-defs{ position:absolute; width:0; height:0; overflow:hidden; }
  .tool-icon{
    width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:1.75;
    stroke-linecap:round; stroke-linejoin:round; pointer-events:none;
  }
  .editor-topbar .tool-btn, .editor-toolbar .tool-btn{ width:42px; min-height:44px; padding:0; flex-shrink:0; }
  .type-opt .tool-icon{ display:block; margin:auto; width:24px; height:24px; }
  .tool-btn:active{ transform:scale(.92); }
  .tool-btn.on{ color:#fff; background:var(--accent); border-color:var(--accent); }

  /* ---------- PORTADA ---------- */
  #screen-portada{
    background: radial-gradient(120% 70% at 50% -10%, var(--bg-2) 0%, var(--bg) 60%);
    justify-content:center; align-items:center; position:relative;
    padding-top:calc(env(safe-area-inset-top) + 20px);
  }
  .portada-inner{ text-align:center; padding:0 30px; width:100%; position:relative; z-index:2; }
  .portada-eyebrow{
    font-family:var(--font-body); letter-spacing:.28em; text-transform:uppercase;
    font-size:11.5px; color:var(--ink-soft); margin-bottom:10px; font-weight:800;
  }
  .portada-title{
    font-family:var(--font-display); color:var(--ink); font-weight:800;
    font-size:clamp(44px, 10vw, 78px); line-height:1.02; margin:0;
  }
  .portada-title .years{
    display:block; color:var(--accent); font-size:.56em; margin-top:6px; font-weight:700;
  }
  .portada-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; max-width:380px; margin:0 auto; }
  .portada-btn{
    font-family:var(--font-body); font-weight:800; font-size:15px;
    border:none; border-radius:var(--r-pill); padding:20px 10px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    transition: transform .15s ease;
  }
  .portada-btn:active{ transform:scale(.95); }
  .portada-btn.primary{ background:var(--accent); color:#fff; box-shadow:0 10px 24px rgba(168,46,97,.35); }
  .portada-btn.secondary{ background:#fff; color:var(--ink); border:1.5px solid var(--border); }

  /* ---------- CALENDARIO ---------- */
  #screen-calendario{
    background: radial-gradient(120% 70% at 50% -10%, var(--bg-2) 0%, var(--bg) 60%);
    padding: calc(env(safe-area-inset-top) + 18px) 18px 18px;
  }
  .cal-topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .cal-topbar-title{ color:var(--ink); font-family:var(--font-display); font-size:24px; font-weight:800; }
  .cal-card{
    background:var(--card); border-radius:28px; flex:1; min-height:0;
    display:flex; flex-direction:column; padding:18px 16px 14px;
    box-shadow:0 20px 46px rgba(76,36,57,.10); overflow:hidden;
  }
  .cal-controls{ display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .cal-picker{
    min-height:42px; padding:9px 15px; border:0; border-radius:12px;
    background:var(--accent); color:#fff; font:800 14px var(--font-body);
    display:flex; align-items:center; gap:10px; cursor:pointer;
  }
  .cal-picker::after{
    content:''; width:6px; height:6px; border:solid currentColor;
    border-width:0 2px 2px 0; transform:rotate(45deg); margin-top:-4px;
  }
  .cal-picker[aria-expanded="true"]{ background:var(--accent-dark); }
  .cal-options{
    position:absolute; inset-inline-start:0; top:calc(100% + 8px); z-index:20;
    width:min(300px, 100%); max-height: min(240px, 45dvh); overflow:auto;
    padding:8px; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px;
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    box-shadow:0 12px 30px rgba(76,36,57,.18);
  }
  .cal-options[hidden]{ display:none; }
  .year-search{ grid-column:1/-1; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px; }
  .year-search label{ grid-column:1/-1; font-size:13px; font-weight:800; }
  .year-search input{
    min-width:0; padding:7px 9px; border:1px solid var(--border); border-radius:6px;
    font:800 16px var(--font-body); color:var(--ink);
  }
  .cal-options .year-search button{ padding-inline:12px; background:var(--accent); color:#fff; }
  .cal-options button{
    min-height:38px; padding:5px 2px; border:0; border-radius:6px;
    background:transparent; color:var(--ink); font:800 clamp(11px, 3.5vw, 14px) var(--font-body);
    cursor:pointer;
  }
  .cal-options button:hover{ background:var(--bg-2); }
  .cal-options button[aria-pressed="true"]{ background:var(--accent); color:#fff; }

  .weekdays{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:2px; }
  .weekdays span{
    text-align:center; font-size:10.5px; letter-spacing:.06em; color:var(--ink-soft);
    font-weight:800; padding-bottom:8px; text-transform:uppercase;
  }
  .days-grid{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); grid-auto-rows:1fr; flex:1; gap:3px; overflow:auto; }
  .day-cell{
    border-radius:12px; padding:6px 5px; cursor:pointer; position:relative;
    display:flex; flex-direction:column; gap:3px; min-height:56px; background:transparent;
    transition:background .15s ease;
  }
  .day-num{
    font-size:13px; font-weight:800; color:var(--ink); width:22px; height:22px;
    display:flex; align-items:center; justify-content:center; border-radius:50%;
  }
  .day-tag{
    font-size:9px; font-weight:800; border-radius:6px; padding:2px 5px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.4;
  }
  .tag-pink{ background:var(--pink-tag-bg); color:var(--pink-tag-text); }
  .tag-green{ background:var(--green-tag-bg); color:var(--green-tag-text); }

  /* ---------- DAY DETAIL ---------- */
  #screen-day{ background:var(--bg); padding: calc(env(safe-area-inset-top) + 18px) 20px 20px; }
  .day-topbar{ display:flex; align-items:center; gap:14px; margin-bottom:22px; }
  .day-title{ font-family:var(--font-display); font-size:28px; font-weight:800; color:var(--ink); text-transform:capitalize; }
  .day-sub{ font-size:12px; color:var(--ink-soft); letter-spacing:.05em; text-transform:uppercase; font-weight:800; }
  .day-list{ flex:1; overflow:auto; display:flex; flex-direction:column; gap:10px; }
  .day-item{
    background:#fff; border-radius:16px; padding:14px 16px; display:flex; align-items:center; gap:12px;
    box-shadow:0 4px 14px rgba(76,36,57,.05); border-left:4px solid var(--red);
  }
  .day-item.green{ border-left-color:var(--green); }
  .day-item .time{ font-weight:800; font-size:13px; color:var(--ink); min-width:52px; }
  .day-item .label{ font-size:14px; color:var(--ink); flex:1; font-weight:600; }
  .day-item .del{ border:none; background:transparent; color:#C7CDD9; cursor:pointer; font-size:16px; }
  .day-empty{ text-align:center; color:var(--ink-soft); font-size:14px; margin-top:40px; font-weight:600; }
  .add-row{ display:flex; gap:8px; margin-top:14px; }
  .add-row input{
    flex:1; border:1.5px solid var(--border); border-radius:var(--r-pill); padding:12px 18px; font-size:14px;
    font-family:var(--font-body); font-weight:600; background:#fff;
  }
  .add-row select{
    border:1.5px solid var(--border); border-radius:var(--r-pill); padding:0 12px; font-size:13px; background:#fff; font-weight:700;
  }

  /* ---------- NOTAS GALLERY ---------- */
  #screen-notas{ background:var(--bg); padding: calc(env(safe-area-inset-top) + 18px) 20px 20px; }
  .notas-topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .notas-title{ font-family:var(--font-display); font-size:26px; font-weight:800; color:var(--ink); }
  .notas-topbar-right{ display:flex; gap:10px; align-items:center; }
  .new-note-btn{
    background:var(--accent); color:#fff; border:none; border-radius:var(--r-pill); padding:12px 18px;
    font-weight:800; font-size:13.5px; cursor:pointer; box-shadow:0 8px 18px rgba(168,46,97,.32);
  }
  .notas-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; overflow:auto; padding-bottom:10px; flex:1; align-content:start; }
  .note-card{
    border:0; padding:0; font:inherit; text-align:left; border-radius:18px; overflow:hidden; cursor:pointer; box-shadow:0 6px 16px rgba(76,36,57,.07);
    background:#fff; display:flex; flex-direction:column; transition:transform .15s ease;
  }
  .note-card:active{ transform:scale(.97); }
  .note-thumb{ width:100%; height:120px; position:relative; overflow:hidden; }
  .note-thumb img{ width:100%; height:100%; object-fit:contain; display:block; }
  .note-meta{ min-width:0; max-width:100%; padding:10px 12px 12px; }
  .note-meta .t{ font-size:13px; font-weight:800; color:var(--ink); margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .note-meta .d{ font-size:10.5px; color:var(--ink-soft); font-weight:700; }
  .notas-empty{ text-align:center; color:var(--ink-soft); font-size:14px; margin-top:60px; grid-column:1/-1; font-weight:600; }

  /* ---------- NOTE EDITOR ---------- */
  #screen-editor{ background:var(--bg); }
  .editor-topbar{
    display:flex; align-items:center; gap:10px; padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;
    background:rgba(255,255,255,.75); backdrop-filter:blur(10px); border-bottom:1px solid var(--border);
  }
  .editor-title-input{
    flex:1; border:none; background:transparent; font-family:var(--font-display); font-size:19px;
    font-weight:700; color:var(--ink); outline:none;
  }
  .save-btn{
    margin-left:auto; background:var(--accent); color:#fff; border:none; border-radius:var(--r-pill);
    padding:10px 18px; font-weight:800; font-size:13px; cursor:pointer; flex-shrink:0;
  }
  .editor-toolbar{
    display:grid; grid-template-columns:auto 1fr; align-items:center; gap:10px;
    padding:9px 14px; background:rgba(255,255,255,.75);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--border);
  }
  .toolbar-undo{ display:flex; gap:6px; flex-shrink:0; }
  .toolbar-main{ display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:8px; row-gap:8px; }
  .tool-group{ display:flex; flex-direction:column; align-items:center; gap:4px; flex-shrink:0; }
  .tool-dot{
    width:14px; height:14px; border-radius:50%; cursor:pointer;
    border:1.5px solid #fff; box-shadow:0 0 0 1.5px var(--border); flex-shrink:0;
  }
  .type-row{ display:flex; gap:10px; margin-bottom:18px; }
  .type-opt{
    flex:1; border:1.5px solid var(--border); border-radius:14px; padding:12px 6px; text-align:center;
    cursor:pointer; font-weight:800; font-size:12px; color:var(--ink); background:#fff;
  }
  .type-opt.active{ border-color:var(--accent); background:var(--accent-tint); color:var(--accent-dark); }
  .slider-row{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .slider-row input[type=range]{ flex:1; accent-color:var(--accent); height:20px; }
  .slider-preview{ width:26px; height:26px; border-radius:50%; background:var(--ink); flex-shrink:0; }
  .slider-value{ font-size:12px; font-weight:700; color:var(--ink-soft); min-width:36px; text-align:right; }
  .color-chip{
    display:flex; align-items:center; gap:10px; width:100%; border:1.5px solid var(--border);
    border-radius:14px; padding:10px 14px; background:#fff; cursor:pointer;
    font-family:var(--font-body); font-weight:700; font-size:13px; color:var(--ink);
  }
  .color-chip-swatch{ width:22px; height:22px; border-radius:6px; border:1px solid rgba(0,0,0,.08); flex-shrink:0; }
  .cp-square-wrap{ position:relative; margin-bottom:14px; border-radius:12px; overflow:hidden; }
  #cpSquare{ display:block; width:100%; height:150px; cursor:crosshair; touch-action:none; }
  .cp-square-thumb{
    position:absolute; width:16px; height:16px; border-radius:50%; border:2.5px solid #fff;
    box-shadow:0 0 0 1.5px rgba(0,0,0,.35), 0 1px 4px rgba(0,0,0,.3); transform:translate(-50%,-50%); pointer-events:none;
  }
  .cp-hue-row{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .cp-eyedrop{
    min-height:34px; padding:0 9px; border-radius:var(--r-pill); font:800 11px var(--font-body); border:1.5px solid var(--border); background:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .cp-hue-slider{
    flex:1; height:14px; border-radius:7px; -webkit-appearance:none; appearance:none;
    background:linear-gradient(to right, red, #ff0, #0f0, #0ff, #00f, #f0f, red);
  }
  .cp-hue-slider::-webkit-slider-thumb{
    -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:#fff;
    border:2.5px solid #fff; box-shadow:0 0 0 1.5px rgba(0,0,0,.35), 0 1px 4px rgba(0,0,0,.3); cursor:pointer;
  }
  .cp-rgb-row{ display:flex; gap:10px; }
  .cp-rgb-field{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .cp-rgb-field input{
    width:100%; text-align:center; border:1.5px solid var(--border); border-radius:10px; padding:8px 4px;
    font-family:var(--font-body); font-weight:700; font-size:14px; color:var(--ink);
  }
  .cp-rgb-field label{ font-size:10.5px; letter-spacing:.06em; color:var(--ink-soft); font-weight:700; }
  .note-workspace{
    position:relative; flex:1; min-height:0; overflow:auto; overflow-anchor:none;
    padding:var(--sheet-gutter); --sheet-gutter:clamp(6px, 2vw, 16px);
  }
  .canvas-wrap{
    position:relative; overflow:hidden; width:100%;
    height:100%; margin-inline:auto;
  }
  .note-workspace.is-panning #noteCanvas{ touch-action:pan-x pan-y; cursor:grab; }
  .note-workspace.is-panning #noteCanvas:active{ cursor:grabbing; }
  .note-workspace.is-panning .text-box,
  .note-workspace.is-panning .sticky{ pointer-events:none; }
  .note-workspace.is-panning .sticky *{ pointer-events:none; }
  #noteCanvas{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  .sel-overlay{ position:absolute; inset:0; pointer-events:none; }
  .sel-marquee{ position:absolute; border:2px dashed var(--accent); background:rgba(168,46,97,.08); border-radius:8px; }
  .sel-marquee.circle{ border-radius:50%; }
  .stickies-layer{ position:absolute; inset:0; pointer-events:none; }
  .sticky{ position:absolute; touch-action:none; cursor:grab; }
  .sticky:active{ cursor:grabbing; }
  .sticky.selected{ outline:2.5px solid var(--accent); outline-offset:2px; }
  .sticky-tab{ border-radius:5px; opacity:.55; box-shadow:0 3px 8px rgba(0,0,0,.12); pointer-events:auto; }
  .sticky-square{ border-radius:6px; box-shadow:0 6px 16px rgba(0,0,0,.16); padding:10px; pointer-events:auto; transform:rotate(-1.2deg); }
  .sticky-square .sticky-text{ width:100%; height:100%; outline:none; font-family:var(--font-body); font-size:13px; color:rgba(20,23,28,.82); font-weight:600; overflow:hidden; cursor:text; }
  .sticky-del{
    position:absolute; top:-8px; right:-8px; min-height:20px; padding:0 6px; border-radius:var(--r-pill);
    background:#fff; border:1px solid var(--border); font:800 10px var(--font-body); line-height:18px; text-align:center;
    cursor:pointer; display:none; pointer-events:auto; color:var(--ink-soft); z-index:2;
  }
  .sticky-resize{
    position:absolute; right:-7px; bottom:-7px; width:18px; height:18px; border-radius:50%;
    background:#fff; border:1.5px solid var(--border); cursor:nwse-resize; display:none; pointer-events:auto;
    touch-action:none; z-index:2;
  }
  .sticky:hover .sticky-del, .sticky.dragging .sticky-del, .sticky.selected .sticky-del{ display:block; }
  .sticky:hover .sticky-resize, .sticky.dragging .sticky-resize, .sticky.selected .sticky-resize{ display:block; }
  .sel-del-btn{
    position:absolute; min-height:26px; padding:0 6px; border-radius:var(--r-pill); background:#fff; border:1.5px solid var(--accent);
    color:var(--accent); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px; font-weight:800;
    pointer-events:auto; box-shadow:0 3px 8px rgba(76,36,57,.2); transform:translate(-50%,-50%);
  }
  .text-layer{ position:absolute; inset:0; pointer-events:none; }
  .text-box{
    position:absolute; min-width:60px; min-height:24px; outline:none; font-size:16px;
    color:var(--paper-ink, var(--ink)); font-family:var(--font-body); font-weight:600; pointer-events:auto; padding:2px 4px; border-radius:4px;
  }
  .text-box:focus{ background:rgba(255,255,255,.5); }

  .panel{
    position:absolute; bottom:0; left:0; right:0; background:#fff; border-radius:24px 24px 0 0;
    box-shadow:0 -8px 30px rgba(76,36,57,.15); padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);
    visibility:hidden; transform:translateY(100%); transition:transform .28s ease; z-index:30;
  }
  .panel.open{ visibility:visible; transform:translateY(0); }
  .panel h4{ margin:0 0 12px; font-size:13px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); font-weight:800; }
  #stylePanel, #colorPickerPanel{ max-height:85%; overflow:auto; }
  #stylePanel .panel-close, #colorPickerPanel .panel-close{ position:sticky; top:0; float:right; z-index:1; }
  .paper-format{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
  .paper-format label{ flex:1 1 130px; display:grid; gap:4px; font-size:13px; font-weight:800; }
  .paper-format select{
    width:100%; min-height:40px; padding:6px 8px; color:var(--ink); background:var(--card);
    border:1px solid var(--border); border-radius:9px; font:inherit;
  }
  .template-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .template-opt{
    min-height:42px; padding:6px 10px; border-radius:9px; border:1px solid var(--border);

  .panel-close{
    position:absolute; top:-18px; right:18px; width:36px; height:36px; border-radius:50%;
    background:#fff; box-shadow:0 4px 14px rgba(76,36,57,.15); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }


  html{ background:#ECD8E2; }
  #screen-portada{ padding:24px 16px; overflow:auto; justify-content:safe center; }

    width:min(100%, 580px); padding:clamp(24px, 6vw, 58px);

  .cal-card, .note-card{ border:1px solid var(--border); }
  .day-cell:not(:disabled):hover{ box-shadow:inset 0 0 0 1px var(--accent); }
  .day-cell.day-off{ background:var(--accent-tint); }
  .day-cell.outside .day-num{ color:#877480; }
  .day-cell.today{ background:var(--accent-dark); }
  .day-cell.today .day-num{ color:#fff; }
  #screen-editor{ background:#F2DFE8; }
  .editor-body{ position:relative; display:flex; flex:1; min-height:0; flex-direction:column; }
  .editor-body > .note-workspace{ order:1; min-width:0; }
  .editor-toolbar{ align-items:start; flex-shrink:0; min-width:0; }
  .editor-toolbar[hidden], .toolbar-grip[hidden]{ display:none; }
  .editor-body[data-dock="bottom"] > .editor-toolbar,
  .editor-body[data-dock="right"] > .editor-toolbar{ order:2; }
  .editor-body[data-dock="left"], .editor-body[data-dock="right"]{ flex-direction:row; }
  .editor-body[data-dock="left"] > .editor-toolbar,
  .editor-body[data-dock="right"] > .editor-toolbar{
    width:82px; display:flex; flex-direction:column; gap:8px;
    overflow:auto; padding:8px 5px; border:1px solid var(--border);
  }
  .editor-body[data-dock="left"] :is(.toolbar-undo, .toolbar-main),
  .editor-body[data-dock="right"] :is(.toolbar-undo, .toolbar-main){
    flex-direction:column; align-items:center; width:100%;
  }
  .editor-body[data-dock="floating"] > .editor-toolbar{
    position:absolute; z-index:5; display:grid; grid-template-columns:minmax(0,1fr);
    width:min(270px, 100%); max-height:100%; overflow:auto; padding:8px;
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    box-shadow:0 8px 26px rgba(76,36,57,.18);
  }
  .editor-toolbar .toolbar-grip{
    width:100%; min-height:32px; cursor:grab; touch-action:none;
    background:var(--accent-tint); color:var(--accent-dark);
  }
  .editor-toolbar .toolbar-grip:active{ cursor:grabbing; }
  .toolbar-position{ display:block; margin-bottom:16px; }
  .toolbar-main{ align-items:center; justify-content:flex-start; }
  .tool-group{ flex-direction:row; }
  .tool-dot{ width:24px; height:24px; padding:0; }
  .canvas-wrap{
    min-height:0;
    border-radius:12px; background:#fff; box-shadow:0 2px 12px rgba(76,36,57,.13);
  }
  button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--accent-dark); outline-offset:2px;
  }
  @media (max-width:390px){
    .portada-grid{ grid-template-columns:1fr; gap:9px; }
    .cal-controls{ gap:6px; }
    .cal-picker{ padding-inline:11px; }
  }
  @media (prefers-reduced-motion:reduce){
    .screen, button{ transition:none; }
  }
  .add-row input, .editor-title-input, .cp-hue-slider{ min-width:0; }
  .panel-close{ width:auto; padding-inline:9px; font:800 12px var(--font-body); }
  .day-item .del{ color:var(--ink-soft); font:800 12px var(--font-body); }
  @media (max-width:640px){
    .editor-toolbar{ grid-template-columns:minmax(0,1fr); padding-inline:8px; }

<script>
/* ---------- navigation ---------- */
function goTo(name){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
}

/* ---------- calendar state ---------- */
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const today = new Date();
let curYear = today.getFullYear(), curMonth = today.getMonth();

function loadData(key, fallback){
  try {
    return JSON.parse(localStorage.getItem('agenda.' + key)) ?? fallback;
  } catch {
    return fallback;
  }
}
function storeData(key, value){
  try {
    localStorage.setItem('agenda.' + key, JSON.stringify(value, (name, item) => name === 'el' ? undefined : item));
    return true;
  } catch {
    alert('No se han podido guardar los cambios. Comprueba el espacio disponible y los permisos de almacenamiento.');
    return false;
  }
}
let events = loadData('events', {});

// Festivos de ámbito común en los calendarios laborales del BOE 2026 y 2027.
const HOLIDAYS = {
  2026: new Set(['1-1', '1-6', '4-3', '5-1', '8-15', '10-12', '12-8', '12-25']),
  2027: new Set(['1-1', '1-6', '3-26', '5-1', '10-12', '11-1', '12-6', '12-8', '12-25']),
};

const calOptions = document.getElementById('calOptions');
const monthPicker = document.getElementById('monthPicker');
const yearPicker = document.getElementById('yearPicker');
let activePicker = null;

function capitalize(text){
  return text[0].toUpperCase() + text.slice(1);
}

function closeCalOptions(restoreFocus = false){
  if(!activePicker) return;
  activePicker.setAttribute('aria-expanded', 'false');
  if(restoreFocus) activePicker.focus();
  calOptions.hidden = true;
  activePicker = null;
}

function toggleCalOptions(picker, label, choices, selected, select){
  const wasOpen = activePicker === picker;
  closeCalOptions();
  if(wasOpen) return;
  activePicker = picker;
  picker.setAttribute('aria-expanded', 'true');
  calOptions.setAttribute('aria-label', label);
  calOptions.replaceChildren();
  let selectedButton;
  for(const [value, text] of choices){
    const option = document.createElement('button');
    option.type = 'button';
    option.textContent = text;
    option.setAttribute('aria-pressed', String(value === selected));
    option.onclick = ()=>{
      select(value);
      renderCalendar();
      closeCalOptions(true);
    };
    calOptions.appendChild(option);
    if(value === selected) selectedButton = option;
  }
  calOptions.hidden = false;
  selectedButton?.focus();
}

function calendarDate(year, month, day){
  const date = new Date(0);
  date.setHours(12, 0, 0, 0);
  date.setFullYear(year, month, day);
  return date;
}

function renderCalendar(){
  document.getElementById('monthName').textContent = capitalize(MONTHS[curMonth]);
  document.getElementById('yearLabel').textContent = curYear;
  const grid = document.getElementById('daysGrid');
  grid.innerHTML = '';

  const firstDay = calendarDate(curYear, curMonth, 1);
  let startOffset = firstDay.getDay() - 1;
  if(startOffset < 0) startOffset = 6;
  const daysInMonth = calendarDate(curYear, curMonth + 1, 0).getDate();
  const daysInPrev = calendarDate(curYear, curMonth, 0).getDate();

  const today = new Date();
  const cells = [];
  for(let i=startOffset; i>0; i--) cells.push({d: daysInPrev - i + 1, outside:true});
  for(let d=1; d<=daysInMonth; d++) cells.push({d, outside:false});
  let nd = 1;
  while(cells.length % 7 !== 0 || cells.length < 42) cells.push({d: nd++, outside:true});

  cells.forEach((c, index)=>{
    const div = document.createElement('button');
    div.type = 'button';
    div.disabled = c.outside;
    div.className = 'day-cell' + (c.outside ? ' outside' : '');
    const key = curYear + '-' + curMonth + '-' + c.d;
    const isToday = !c.outside && curYear===today.getFullYear() && curMonth===today.getMonth() && c.d===today.getDate();
    const isHoliday = !c.outside && HOLIDAYS[curYear]?.has((curMonth + 1) + '-' + c.d);
    if(!c.outside && (index % 7 >= 5 || isHoliday)) div.classList.add('day-off');
    if(isHoliday) div.title = 'Festivo nacional';
    if(isToday){
      div.classList.add('today');
      div.setAttribute('aria-current', 'date');
    }

    const num = document.createElement('div');
    num.className = 'day-num';
    num.textContent = c.d;
    div.appendChild(num);

    if(!c.outside && events[key]){
      events[key].slice(0,2).forEach(ev=>{
        const tag = document.createElement('div');
        tag.className = 'day-tag tag-' + ev.color;
        tag.textContent = ev.label;
        div.appendChild(tag);
      });
    }
    if(!c.outside){
      div.onclick = ()=>openDay(curYear, curMonth, c.d);
    }
    grid.appendChild(div);
  });
}

function openDay(y, m, d){
  document.getElementById('daySub').textContent = MONTHS[m][0].toUpperCase()+MONTHS[m].slice(1) + ' ' + y;
  const date = calendarDate(y, m, d);

function addDayItem(){
  const text = document.getElementById('newItemText');
  const color = document.getElementById('newItemColor').value;
  if(!text.value.trim()) return;
  const now = new Date();
  const time = now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  const key = window._curDayKey;
  const next = {...events, [key]: [...(events[key] || []), {time, label:text.value.trim(), color}]};

  events = next;
  renderDayList();
  renderCalendar();

];
const PAPER_SIZES = {
  a5: [559, 794], a4: [794, 1123], letter: [816, 1056], a3: [1123, 1587],
};

const CONTINUOUS_PAGE_HEIGHT = 960;
let paperDefaults = loadData('paperDefaults', {
  bg:'#FFFFFF', template:'blank', paperSize:'a5', orientation:'portrait',
});

function savePaperDefaults(){
  const {bg, template, paperSize = 'auto', orientation = 'portrait'} = currentNote;
  const defaults = {bg, template, paperSize, orientation};
  if(!storeData('paperDefaults', defaults)) return;
  paperDefaults = defaults;
  document.getElementById('paperPreferenceStatus').textContent = 'Preferencias guardadas en este dispositivo.';
}

function applyPaperFormat(){
  const sheet = document.getElementById('canvasWrap');
  const landscape = currentNote.orientation === 'landscape';
  if(currentNote.paperSize === 'continuous'){
    sheet.style.width = (landscape ? 1123 : 794) + 'px';
    currentNote.continuousHeight ||= CONTINUOUS_PAGE_HEIGHT;
    sheet.style.height = currentNote.continuousHeight + 'px';
    return;
  }
  const size = PAPER_SIZES[currentNote.paperSize];
  if(!size){
    sheet.style.width = '';
    sheet.style.height = '';
    return;
  }
  const [width, height] = size;
  sheet.style.width = (landscape ? height : width) + 'px';
  sheet.style.height = (landscape ? width : height) + 'px';
}

function layoutDrawingCanvas(){
  const sheet = document.getElementById('canvasWrap');
  const workspace = document.getElementById('noteWorkspace');
  const continuous = currentNote.paperSize === 'continuous';
  const visibleTop = Math.max(0, workspace.scrollTop - sheet.offsetTop);
  if(continuous && visibleTop + workspace.clientHeight + 180 > currentNote.continuousHeight){
    const needed = visibleTop + workspace.clientHeight + 180;
    currentNote.continuousHeight = Math.ceil(needed / CONTINUOUS_PAGE_HEIGHT) * CONTINUOUS_PAGE_HEIGHT;
    sheet.style.height = currentNote.continuousHeight + 'px';
  }
  const top = continuous ? visibleTop : 0;
  const width = sheet.clientWidth;
  const height = continuous ? Math.min(sheet.clientHeight - top, workspace.clientHeight) : sheet.clientHeight;
  if(canvas.width !== width * 2) canvas.width = width * 2;
  if(canvas.height !== height * 2) canvas.height = height * 2;
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';
  canvas.style.top = top + 'px';
  ctx.setTransform(2, 0, 0, 2, 0, -top * 2);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
}

function changePaperFormat(){
  commitIfFloating();
  currentNote.paperSize = document.getElementById('paperSize').value;
  currentNote.orientation = document.getElementById('paperOrientation').value;

}

const PEN_TYPES = [
  {id:'lapiz', label:'Lápiz', width:1.6, alpha:0.75},

  {id:'pincel', label:'Pincel', width:8, alpha:0.9}
];
const STICKY_TAB_COLORS = ['#FFD166','#FF8FA3','#8ECDDD','#B8E986','#C9A7EB'];
const STICKY_SQUARE_COLORS = ['#FFF59D','#FFAB91','#A5D6A7','#90CAF9','#F48FB1'];

let currentSquareColor = STICKY_SQUARE_COLORS[0];
let selectedStickyId = null;

// selection/move tool state
let selMode = 'idle'; // idle | drawing | dragging | floating
let selStart = null, selBox = null, dragAnchor = null;
let floatingDX = 0, floatingDY = 0;
let liftedStrokeRefs = [], liftedTextRefs = [];

// undo/redo
let undoStack = [], redoStack = [];
function snapshotState(){
  return JSON.stringify({
    strokes: currentNote.strokes,
    texts: (currentNote.texts||[]).map(t=>({x:t.x,y:t.y,text:t.text})),
    stickies: (currentNote.stickies||[]).map(s=>({id:s.id,type:s.type,x:s.x,y:s.y,w:s.w,h:s.h,color:s.color,text:s.text}))
  });
}
function pushUndoSnapshot(){
  undoStack.push(snapshotState());
  if(undoStack.length>40) undoStack.shift();
  redoStack = [];
  updateUndoRedoButtons();
}
function restoreSnapshot(json){
  const data = JSON.parse(json);
  currentNote.strokes = data.strokes;
  currentNote.texts = data.texts;
  currentNote.stickies = data.stickies;
  liftedStrokeRefs = []; liftedTextRefs = []; selMode = 'idle'; selBox = null;
  redrawStrokes(); rebuildTextLayer(); rebuildStickiesLayer(); renderSelOverlay();
}
function doUndo(){
  if(!undoStack.length) return;
  redoStack.push(snapshotState());
  restoreSnapshot(undoStack.pop());
  updateUndoRedoButtons();
}
function doRedo(){
  if(!redoStack.length) return;
  undoStack.push(snapshotState());
  restoreSnapshot(redoStack.pop());
  updateUndoRedoButtons();
}
function updateUndoRedoButtons(){
  const u = document.getElementById('btnUndo'), r = document.getElementById('btnRedo');
  if(u) u.style.opacity = undoStack.length ? '1' : '.35';
  if(r) r.style.opacity = redoStack.length ? '1' : '.35';
}

function setupCanvas(){
  canvas = document.getElementById('noteCanvas');
  ctx = canvas.getContext('2d');
  layoutDrawingCanvas();
  selMode = 'idle'; selBox = null; liftedStrokeRefs = []; liftedTextRefs = []; floatingDX = 0; floatingDY = 0;
  renderSelOverlay();

  const workspace = document.getElementById('noteWorkspace');
  let panStart = null;
  canvas.onpointerdown = e=>{
    if(currentTool === 'pan'){
      if(e.pointerType === 'mouse' && e.button === 0){
        panStart = {x:e.clientX, y:e.clientY, left:workspace.scrollLeft, top:workspace.scrollTop};
        canvas.setPointerCapture(e.pointerId);
      }
      return;
    }
    if(selectedStickyId) deselectStickies();
    const p = getPos(e);
    if(currentTool === 'text' || currentTool === 'posittab' || currentTool === 'positsquare') return;
    if(currentTool === 'select'){ handleSelectDown(p); return; }
    drawing = true;
    pushUndoSnapshot();
    let strokeObj;
    if(currentTool === 'highlighter'){
      strokeObj = {tool:'highlighter', color: currentHLColor, width:16, alpha:0.38, points:[p]};
    } else if(currentTool === 'eraser'){
      strokeObj = {tool:'eraser', width:24, points:[p]};
    } else {
      strokeObj = {tool:'pen', color: currentPenColor, width: currentPenWidth, alpha: currentPenAlpha, points:[p]};
    }
    currentNote.strokes.push(strokeObj);
    canvas.setPointerCapture(e.pointerId);
    redrawStrokes();
  };
  canvas.onpointermove = e=>{
    if(panStart){
      workspace.scrollLeft = panStart.left + panStart.x - e.clientX;
      workspace.scrollTop = panStart.top + panStart.y - e.clientY;
      return;
    }
    const p = getPos(e);
    if(currentTool === 'select'){ handleSelectMove(p); return; }
    if(!drawing) return;
    currentNote.strokes[currentNote.strokes.length-1].points.push(p);
    redrawStrokes();
  };
  canvas.onpointerup = e=>{
    panStart = null;
    if(currentTool === 'select'){ handleSelectUp(); return; }
    drawing = false;
  };
  canvas.onpointercancel = canvas.onpointerup;
  canvas.onpointerleave = ()=>{ if(currentTool !== 'select') drawing = false; };
  canvas.onclick = e=>{
    const wrap = document.getElementById('canvasWrap').getBoundingClientRect();
    const x = e.clientX - wrap.left, y = e.clientY - wrap.top;
    if(currentTool === 'text'){ pushUndoSnapshot(); addTextBox(x,y,''); }
    else if(currentTool === 'posittab'){ addSticky('tab', x, y); }
    else if(currentTool === 'positsquare'){ addSticky('square', x, y); }
  };
}
function getPos(e){ const r = document.getElementById('canvasWrap').getBoundingClientRect(); return {x: e.clientX - r.left, y: e.clientY - r.top}; }

function drawStroke(s, dx, dy){
  ctx.save();
  if(s.tool === 'eraser'){
    ctx.globalCompositeOperation = 'destination-out';
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(0,0,0,1)';
    ctx.fillStyle = 'rgba(0,0,0,1)';
    ctx.lineWidth = s.width;
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = s.alpha !== undefined ? s.alpha : 1;
    ctx.strokeStyle = s.color || '#14171C';
    ctx.fillStyle = s.color || '#14171C';
    ctx.lineWidth = s.width || 2.6;
  }
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const pts = s.points;
  if(pts.length < 2){
    if(pts.length === 1){
      ctx.beginPath();
      ctx.arc(pts[0].x+dx, pts[0].y+dy, (s.width||2.6)/2, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
    return;
  }
  ctx.beginPath();
  ctx.moveTo(pts[0].x+dx, pts[0].y+dy);
  pts.forEach(p=> ctx.lineTo(p.x+dx, p.y+dy));
  ctx.stroke();
  ctx.restore();
}
function redrawStrokes(){
  // clearRect only wipes the drawing layer (transparent canvas);
  // the paper color and template live underneath as CSS, so they're never touched.
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.restore();
  currentNote.strokes.forEach(s=>{
    const lifted = liftedStrokeRefs.includes(s);
    drawStroke(s, lifted ? floatingDX : 0, lifted ? floatingDY : 0);
  });
}
function clearCanvas(){
  // Only wipes drawing + text + stickies. Background color and template are locked and stay untouched.
  pushUndoSnapshot();
  currentNote.strokes = [];
  currentNote.texts = [];
  currentNote.stickies = [];
  liftedStrokeRefs = []; liftedTextRefs = [];
  selMode = 'idle'; selBox = null; floatingDX = 0; floatingDY = 0;
  redrawStrokes();
  rebuildTextLayer();
  rebuildStickiesLayer();
  renderSelOverlay();
}
function commitIfFloating(){
  if(selMode === 'floating' || selMode === 'dragging'){ commitFloatingSelection(); selMode = 'idle'; }

function setTool(t){

/* ---------- full color picker ---------- */
let cpTarget = 'pen', cpHue = 0, cpSat = 0, cpVal = 0;
function hexToRgb(hex){
  hex = hex.replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16);
  return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
}
function rgbToHex(r,g,b){ return '#' + [r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('').toUpperCase(); }
function rgbToHsv(r,g,b){
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  let h=0;
  if(d!==0){
    if(max===r) h = 60*(((g-b)/d)%6);
    else if(max===g) h = 60*((b-r)/d+2);
    else h = 60*((r-g)/d+4);
  }
  if(h<0) h+=360;
  return { h, s: max===0?0:d/max, v: max };
}
function hsvToRgb(h,s,v){
  const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;}
  else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
  return { r:(r+m)*255, g:(g+m)*255, b:(b+m)*255 };
}
function drawColorSquare(hue){
  const cv = document.getElementById('cpSquare');
  const c = cv.getContext('2d');
  const w = cv.width, h = cv.height;
  const hc = hsvToRgb(hue,1,1);
  const hueColor = 'rgb('+Math.round(hc.r)+','+Math.round(hc.g)+','+Math.round(hc.b)+')';
  c.clearRect(0,0,w,h);
  const satGrad = c.createLinearGradient(0,0,w,0);
  satGrad.addColorStop(0,'#fff'); satGrad.addColorStop(1,hueColor);
  c.fillStyle = satGrad; c.fillRect(0,0,w,h);
  const valGrad = c.createLinearGradient(0,0,0,h);
  valGrad.addColorStop(0,'rgba(0,0,0,0)'); valGrad.addColorStop(1,'#000');
  c.fillStyle = valGrad; c.fillRect(0,0,w,h);
}
function updateCpThumb(){
  const cv = document.getElementById('cpSquare');
  const thumb = document.getElementById('cpSquareThumb');
  thumb.style.left = (cpSat*cv.clientWidth)+'px';
  thumb.style.top = ((1-cpVal)*cv.clientHeight)+'px';
  const rgb = hsvToRgb(cpHue,cpSat,cpVal);
  thumb.style.background = rgbToHex(rgb.r,rgb.g,rgb.b);
}
function updateCpRgbFields(r,g,b){
  document.getElementById('cpR').value = Math.round(r);
  document.getElementById('cpG').value = Math.round(g);
  document.getElementById('cpB').value = Math.round(b);
}
function openColorPicker(target){
  cpTarget = target;
  const baseHex = target==='paper' ? currentNote.bg : target==='pen' ? currentPenColor : target==='highlighter' ? currentHLColor : target==='tab' ? currentTabColor : currentSquareColor;
  const rgb = hexToRgb(baseHex);
  const hsv = rgbToHsv(rgb.r, rgb.g, rgb.b);
  cpHue = hsv.h; cpSat = hsv.s; cpVal = hsv.v;
  const cv = document.getElementById('cpSquare');
  cv.width = cv.clientWidth || 280; cv.height = 150;
  document.getElementById('cpHue').value = Math.round(cpHue);
  drawColorSquare(cpHue);
  updateCpThumb();
  updateCpRgbFields(rgb.r, rgb.g, rgb.b);
  closeAllToolPanels();
  document.getElementById('colorPickerPanel').classList.add('open');
}
function closeColorPicker(){
  document.getElementById('colorPickerPanel').classList.remove('open');
  if(cpTarget === 'paper') openPanel();
}
function applyPickedColor(){
  const r = +document.getElementById('cpR').value || 0;
  const g = +document.getElementById('cpG').value || 0;
  const b = +document.getElementById('cpB').value || 0;
  const hex = rgbToHex(r,g,b);
  if(cpTarget === 'paper'){
    currentNote.bg = hex;
    applyBackground();
    closeColorPicker();
    return;
  }
  if(cpTarget === 'pen'){ currentPenColor = hex; currentTool = 'pen'; updateToolButtons(); }
  else if(cpTarget === 'highlighter'){ currentHLColor = hex; currentTool = 'highlighter'; updateToolButtons(); }
  else if(cpTarget === 'tab'){ currentTabColor = hex; currentTool = 'posittab'; updateToolButtons(); }
  else { currentSquareColor = hex; currentTool = 'positsquare'; updateToolButtons(); }
  closeColorPicker();
  if(cpTarget === 'pen') openPenPanel();
  else if(cpTarget === 'highlighter') openHighlighterPanel();
  else if(cpTarget === 'tab') openPositTabPanel();
  else openPositSquarePanel();
}
function initColorPicker(){
  const cv = document.getElementById('cpSquare');
  let cpDragging = false;
  function pick(e){
    const rect = cv.getBoundingClientRect();
    let x = (e.clientX - rect.left) / rect.width;
    let y = (e.clientY - rect.top) / rect.height;
    x = Math.min(1, Math.max(0, x)); y = Math.min(1, Math.max(0, y));
    cpSat = x; cpVal = 1 - y;
    updateCpThumb();
    const rgb = hsvToRgb(cpHue, cpSat, cpVal);
    updateCpRgbFields(rgb.r, rgb.g, rgb.b);
  }
  cv.onpointerdown = e=>{ cpDragging = true; pick(e); cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = e=>{ if(cpDragging) pick(e); };
  cv.onpointerup = cv.onpointercancel = ()=>{ cpDragging = false; };
  document.getElementById('cpHue').oninput = e=>{
    cpHue = parseFloat(e.target.value);
    drawColorSquare(cpHue);
    updateCpThumb();
    const rgb = hsvToRgb(cpHue, cpSat, cpVal);
    updateCpRgbFields(rgb.r, rgb.g, rgb.b);
  };
  ['cpR','cpG','cpB'].forEach(id=>{
    document.getElementById(id).oninput = ()=>{
      const r = +document.getElementById('cpR').value || 0;
      const g = +document.getElementById('cpG').value || 0;
      const b = +document.getElementById('cpB').value || 0;
      const hsv = rgbToHsv(r,g,b);
      cpHue = hsv.h; cpSat = hsv.s; cpVal = hsv.v;
      document.getElementById('cpHue').value = Math.round(cpHue);
      drawColorSquare(cpHue);
      updateCpThumb();
    };
  });
  document.getElementById('cpEyedrop').onclick = async ()=>{
    if(!window.EyeDropper){ alert('El cuentagotas no está disponible en este navegador.'); return; }
    try{
      const result = await new EyeDropper().open();
      const rgb = hexToRgb(result.sRGBHex);
      const hsv = rgbToHsv(rgb.r, rgb.g, rgb.b);
      cpHue = hsv.h; cpSat = hsv.s; cpVal = hsv.v;
      document.getElementById('cpHue').value = Math.round(cpHue);
      drawColorSquare(cpHue); updateCpThumb(); updateCpRgbFields(rgb.r, rgb.g, rgb.b);
    }catch(err){ /* user cancelled */ }
  };
  document.getElementById('penWidthSlider').oninput = e=>{
    currentPenWidth = parseFloat(e.target.value);
    currentPenType = 'custom';
    updatePenPreview();
  };
  document.getElementById('penAlphaSlider').oninput = e=>{
    currentPenAlpha = parseFloat(e.target.value)/100;
    document.getElementById('penAlphaValue').textContent = e.target.value+'%';
    updatePenPreview();
  };
}

/* ---------- posit sticky notes ---------- */
function addSticky(type, x, y){
  if(!currentNote.stickies) currentNote.stickies = [];
  pushUndoSnapshot();
  const w = type==='tab' ? 74 : 130;
  const h = type==='tab' ? 26 : 130;
  const rec = {
    id: 'st'+Date.now()+Math.random().toString(36).slice(2,6), type,
    x: x - w/2, y: y - h/2, w, h,
    color: type==='tab' ? currentTabColor : currentSquareColor, text:''
  };
  currentNote.stickies.push(rec);
  renderSticky(rec);
  selectSticky(rec.id);
}
function selectSticky(id){
  selectedStickyId = id;
  document.querySelectorAll('.sticky').forEach(el=> el.classList.toggle('selected', el.dataset.stickyId === id));
}
function deselectStickies(){
  selectedStickyId = null;
  document.querySelectorAll('.sticky').forEach(el=> el.classList.remove('selected'));
}
function renderSticky(rec){
  const layer = document.getElementById('stickiesLayer');
  const el = document.createElement('div');
  el.className = 'sticky sticky-' + rec.type + (rec.id === selectedStickyId ? ' selected' : '');
  el.dataset.stickyId = rec.id;
  el.style.left = rec.x+'px'; el.style.top = rec.y+'px';
  el.style.width = rec.w+'px'; el.style.height = rec.h+'px';
  el.style.background = rec.color;
  el.innerHTML = '<button type="button" class="sticky-del">Eliminar</button>' + (rec.type==='square' ? '<div class="sticky-text" contenteditable="true"></div>' : '') + '<div class="sticky-resize"></div>';
  rec.el = el;
  if(rec.type === 'square'){
    const txt = el.querySelector('.sticky-text');
    txt.textContent = rec.text || '';
    txt.onfocus = ()=>{ selectSticky(rec.id); pushUndoSnapshot(); };
    txt.oninput = ()=> rec.text = txt.textContent;
    txt.onpointerdown = ev => ev.stopPropagation();
  }
  el.querySelector('.sticky-del').onclick = ev=>{ ev.stopPropagation(); pushUndoSnapshot(); removeSticky(rec); };

  // drag to move
  let dragging = false, startX=0, startY=0, origX=0, origY=0, moved=false;
  el.onpointerdown = ev=>{
    if(ev.target.classList.contains('sticky-text') || ev.target.classList.contains('sticky-del') || ev.target.classList.contains('sticky-resize')) return;
    ev.stopPropagation();
    if(currentTool === 'eraser'){
      pushUndoSnapshot(); removeSticky(rec);
      if(selectedStickyId === rec.id) selectedStickyId = null;
      return;
    }
    selectSticky(rec.id);
    dragging = true; moved = false; el.classList.add('dragging');
    startX = ev.clientX; startY = ev.clientY; origX = rec.x; origY = rec.y;
    el.setPointerCapture(ev.pointerId);
  };
  el.onpointermove = ev=>{
    if(!dragging) return;
    if(!moved){ pushUndoSnapshot(); moved = true; }
    rec.x = origX + (ev.clientX - startX);
    rec.y = origY + (ev.clientY - startY);
    el.style.left = rec.x+'px'; el.style.top = rec.y+'px';
  };
  el.onpointerup = ()=>{ dragging = false; el.classList.remove('dragging'); };
  el.onpointerleave = ()=>{ if(dragging){ dragging=false; el.classList.remove('dragging'); } };

  // resize handle (width + height)
  const resizeHandle = el.querySelector('.sticky-resize');
  let resizing = false, rStartX=0, rStartY=0, rOrigW=0, rOrigH=0;
  const minW = rec.type==='tab' ? 40 : 60, minH = rec.type==='tab' ? 18 : 60;
  resizeHandle.onpointerdown = ev=>{
    ev.stopPropagation();
    selectSticky(rec.id);
    resizing = true; rStartX = ev.clientX; rStartY = ev.clientY; rOrigW = rec.w; rOrigH = rec.h;
    pushUndoSnapshot();
    resizeHandle.setPointerCapture(ev.pointerId);
  };
  resizeHandle.onpointermove = ev=>{
    if(!resizing) return;
    rec.w = Math.max(minW, rOrigW + (ev.clientX - rStartX));
    rec.h = Math.max(minH, rOrigH + (ev.clientY - rStartY));
    el.style.width = rec.w+'px'; el.style.height = rec.h+'px';
  };
  resizeHandle.onpointerup = ()=>{ resizing = false; };
  resizeHandle.onpointerleave = ()=>{ if(resizing) resizing = false; };

  layer.appendChild(el);
}
function removeSticky(rec){
  currentNote.stickies = (currentNote.stickies||[]).filter(s=>s.id!==rec.id);
  if(rec.el) rec.el.remove();
}
function rebuildStickiesLayer(){
  const layer = document.getElementById('stickiesLayer');
  layer.innerHTML = '';
  (currentNote.stickies||[]).forEach(rec=> renderSticky(rec));
}

/* ---------- delete selected sticky or floating selection with Delete/Backspace ---------- */
document.addEventListener('keydown', e=>{
  if(e.key !== 'Delete' && e.key !== 'Backspace') return;
  const editorScreen = document.getElementById('screen-editor');
  if(!editorScreen || !editorScreen.classList.contains('active')) return;
  const ae = document.activeElement;
  if(ae && (ae.isContentEditable || ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return;
  if(selectedStickyId){
    const rec = (currentNote.stickies||[]).find(s=>s.id===selectedStickyId);
    if(rec){ e.preventDefault(); pushUndoSnapshot(); removeSticky(rec); selectedStickyId = null; }
    return;
  }
  if(selMode === 'floating' || selMode === 'dragging'){
    e.preventDefault();
    pushUndoSnapshot();
    deleteFloatingSelection();
  }
});

/* ---------- selection / move tool ---------- */
function pointInBox(p, box){ return p.x>=box.x && p.x<=box.x+box.w && p.y>=box.y && p.y<=box.y+box.h; }
function currentSelBoxDisplay(){
  if(!selBox) return {x:0,y:0,w:0,h:0};
  const moving = (selMode==='dragging' || selMode==='floating');
  return { x: selBox.x + (moving?floatingDX:0), y: selBox.y + (moving?floatingDY:0), w: selBox.w, h: selBox.h };
}
function handleSelectDown(p){
  if(selMode === 'floating'){
    if(pointInBox(p, currentSelBoxDisplay())){
      pushUndoSnapshot();
      selMode = 'dragging';
      dragAnchor = p;
      return;
    }
    commitFloatingSelection();
    selMode = 'idle';
  }
  selMode = 'drawing';
  selStart = p;
  selBox = {x:p.x, y:p.y, w:0, h:0};
  renderSelOverlay();
}
function handleSelectMove(p){
  if(selMode === 'drawing'){
    selBox = { x: Math.min(selStart.x,p.x), y: Math.min(selStart.y,p.y), w: Math.abs(p.x-selStart.x), h: Math.abs(p.y-selStart.y) };
    renderSelOverlay();
  } else if(selMode === 'dragging'){
    floatingDX = p.x - dragAnchor.x;
    floatingDY = p.y - dragAnchor.y;
    redrawStrokes();
    liftedTextRefs.forEach(t=>{ if(t.el){ t.el.style.left=(t.x+floatingDX)+'px'; t.el.style.top=(t.y+floatingDY)+'px'; } });
    renderSelOverlay();
  }
}
function handleSelectUp(){
  if(selMode === 'drawing'){
    if(selBox.w < 8 || selBox.h < 8){ selMode='idle'; selBox=null; renderSelOverlay(); return; }
    liftSelection();
    selMode = 'floating';
  } else if(selMode === 'dragging'){
    selMode = 'floating';
  }
}
function liftSelection(){
  const box = selBox;
  function inside(x,y){ return x>=box.x && x<=box.x+box.w && y>=box.y && y<=box.y+box.h; }
  liftedStrokeRefs = currentNote.strokes.filter(s => s.points.length && s.points.every(pt=>inside(pt.x,pt.y)));
  liftedTextRefs = (currentNote.texts||[]).filter(t => inside(t.x+10, t.y+10));
  floatingDX = 0; floatingDY = 0;
  renderSelOverlay();
}
function deleteFloatingSelection(){
  currentNote.strokes = currentNote.strokes.filter(s=> !liftedStrokeRefs.includes(s));
  liftedTextRefs.forEach(t=>{ if(t.el) t.el.remove(); });
  currentNote.texts = (currentNote.texts||[]).filter(t=> !liftedTextRefs.includes(t));
  liftedStrokeRefs = []; liftedTextRefs = [];
  floatingDX = 0; floatingDY = 0;
  selBox = null; selMode = 'idle';
  redrawStrokes();
  renderSelOverlay();
}
function commitFloatingSelection(){
  liftedStrokeRefs.forEach(s=>{ s.points = s.points.map(p=>({x:p.x+floatingDX, y:p.y+floatingDY})); });
  liftedTextRefs.forEach(t=>{
    t.x += floatingDX; t.y += floatingDY;
    if(t.el){ t.el.style.left=t.x+'px'; t.el.style.top=t.y+'px'; }
  });
  liftedStrokeRefs = []; liftedTextRefs = [];
  floatingDX = 0; floatingDY = 0;
  selBox = null; selMode = 'idle';
  redrawStrokes();
  renderSelOverlay();
}
function renderSelOverlay(){
  const ov = document.getElementById('selOverlay');
  if(!ov) return;
  ov.innerHTML = '';
  if(selMode === 'idle' || !selBox) return;
  const disp = (selMode==='drawing') ? selBox : currentSelBoxDisplay();
  const el = document.createElement('div');
  el.className = 'sel-marquee';
  el.style.left = disp.x+'px'; el.style.top = disp.y+'px'; el.style.width = disp.w+'px'; el.style.height = disp.h+'px';
  ov.appendChild(el);
  if(selMode === 'floating'){
    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'sel-del-btn';
    del.textContent = 'Eliminar';
    del.style.left = (disp.x + disp.w) + 'px';
    del.style.top = disp.y + 'px';
    del.title = 'Eliminar selección';
    del.onpointerdown = ev=> ev.stopPropagation();
    del.onclick = ()=>{ pushUndoSnapshot(); deleteFloatingSelection(); };
    ov.appendChild(del);
  }
}
function addTextBox(x, y, value){
  const layer = document.getElementById('textLayer');

const editorBody = document.getElementById('editorBody');
const noteToolbar = document.getElementById('noteToolbar');
const toolbarGrip = document.getElementById('toolbarGrip');
let toolbarPrefs = loadData('noteToolbar', {dock:'top', x:12, y:12});

function positionFloatingToolbar(x, y){
  const maxX = Math.max(0, editorBody.clientWidth - noteToolbar.offsetWidth);
  const maxY = Math.max(0, editorBody.clientHeight - noteToolbar.offsetHeight);
  const left = Math.max(0, Math.min(x, maxX));
  const top = Math.max(0, Math.min(y, maxY));
  noteToolbar.style.left = left + 'px';
  noteToolbar.style.top = top + 'px';
  return {x:left, y:top};
}

function applyToolbarDock(){
  const {dock, x, y} = toolbarPrefs;
  editorBody.dataset.dock = dock;
  noteToolbar.hidden = dock === 'hidden';
  toolbarGrip.hidden = dock !== 'floating';
  if(dock === 'floating') positionFloatingToolbar(x, y);
}

function changeToolbarDock(dock){
  const next = {...toolbarPrefs, dock};
  if(!storeData('noteToolbar', next)){
    document.getElementById('toolbarDock').value = toolbarPrefs.dock;
    return;
  }
  toolbarPrefs = next;
  applyToolbarDock();
  layoutDrawingCanvas();
  redrawStrokes();
}

function rememberToolbarPosition(){
  const next = {...toolbarPrefs, x:noteToolbar.offsetLeft, y:noteToolbar.offsetTop};
  if(storeData('noteToolbar', next)) toolbarPrefs = next;
}

let toolbarDrag = null;
toolbarGrip.onpointerdown = event=>{
  if(event.button !== 0 || toolbarDrag) return;
  toolbarDrag = {
    id:event.pointerId, x:event.clientX, y:event.clientY,
    left:noteToolbar.offsetLeft, top:noteToolbar.offsetTop,
  };
  toolbarGrip.setPointerCapture(event.pointerId);
};
toolbarGrip.onpointermove = event=>{
  if(!toolbarDrag || event.pointerId !== toolbarDrag.id) return;
  positionFloatingToolbar(
    toolbarDrag.left + event.clientX - toolbarDrag.x,
    toolbarDrag.top + event.clientY - toolbarDrag.y,
  );
};
toolbarGrip.onpointerup = toolbarGrip.onpointercancel = event=>{
  if(!toolbarDrag || event.pointerId !== toolbarDrag.id) return;
  toolbarDrag = null;
  rememberToolbarPosition();
};
toolbarGrip.onkeydown = event=>{
  const directions = {ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1]};
  if(!Object.hasOwn(directions, event.key)) return;
  event.preventDefault();
  const [dx, dy] = directions[event.key];
  positionFloatingToolbar(noteToolbar.offsetLeft + dx * 12, noteToolbar.offsetTop + dy * 12);
  rememberToolbarPosition();
};

function applyBackground(){
  const wrap = document.getElementById('canvasWrap');
  wrap.style.background = currentNote.bg;
  const {r, g, b} = hexToRgb(currentNote.bg);
  const darkPaper = (r * 299 + g * 587 + b * 114) / 1000 < 128;
  wrap.style.setProperty('--paper-ink', darkPaper ? '#fff' : 'var(--ink)');
  const patternInk = darkPaper ? '255,255,255' : '20,23,28';
  let bgImage = 'none';
  if(currentNote.template === 'lines') bgImage = 'repeating-linear-gradient(to bottom, transparent, transparent 27px, rgba(' + patternInk + ',.12) 27px, rgba(' + patternInk + ',.12) 28px)';
  if(currentNote.template === 'grid') bgImage = 'repeating-linear-gradient(to bottom, transparent, transparent 27px, rgba(' + patternInk + ',.1) 27px, rgba(' + patternInk + ',.1) 28px), repeating-linear-gradient(to right, transparent, transparent 27px, rgba(' + patternInk + ',.1) 27px, rgba(' + patternInk + ',.1) 28px)';
  if(currentNote.template === 'dots') bgImage = 'radial-gradient(rgba(' + patternInk + ',.18) 1.2px, transparent 1.6px)';
  wrap.style.backgroundImage = bgImage;
  wrap.style.backgroundSize = currentNote.template === 'dots' ? '24px 24px' : 'auto';
  redrawStrokes();
}
renderNotasGrid();
updateToolButtons();
document.addEventListener('visibilitychange', () => {
  if(document.hidden && document.getElementById('screen-editor').classList.contains('active')) saveNote(true);
});
document.getElementById('noteWorkspace').addEventListener('scroll', ()=>{
  if(!currentNote || currentNote.paperSize !== 'continuous') return;
  if(!document.getElementById('screen-editor').classList.contains('active')) return;
  layoutDrawingCanvas();
  redrawStrokes();
});
window.addEventListener('resize', () => {
  if(!document.getElementById('screen-editor').classList.contains('active')) return;
  commitIfFloating();
  applyToolbarDock();
  setupCanvas();
  redrawStrokes();
});
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('./sw.js').catch(error => console.warn('Agenda sin caché offline', error));
}
</script>
</body>
</html>
