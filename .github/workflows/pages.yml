name: Publicar Agenda en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'prueba-cuentas.html'
      - 'portada.css'
      - 'icons/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Preparar la portada de la agenda
        run: |
          mkdir -p _site
          cp -R icons manifest.webmanifest portada.css sw.js _site/
          cp index.html _site/local.html
          cp prueba-cuentas.html _site/index.html
          cat > _site/prueba-cuentas.html <<'HTML'
          <!doctype html>
          <html lang="es">
          <meta charset="utf-8">
          <title>Agenda</title>
          <script>location.replace('./' + location.search + location.hash);</script>
          <a href="./">Abrir la agenda</a>
          </html>
          HTML
          cp _site/prueba-cuentas.html _site/portada.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Esperar a que esté disponible el paquete de Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..6}; do
            if artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.artifacts[] | select(.expired == false) | .id') && [ -n "$artifact_id" ]; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 5; fi
          done
          echo 'El paquete github-pages todavía no está disponible.' >&2
          exit 1
      - name: Publicar web
        id: deployment
        uses: actions/deploy-pages@v4
